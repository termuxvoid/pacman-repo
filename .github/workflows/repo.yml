name: Build and Deploy Pacman Repo to gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          pacman -Syu --noconfirm git gnupg xz

      - name: Create unprivileged builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build all packages
        env:
          JOBS: '2'
        run: |
          su builder -c '
            set -e
            cd "$GITHUB_WORKSPACE"
            tools/build-all.sh
          '

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PRIVATE_GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Assemble and sign repository
        env:
          KEYID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          SIGN=1 KEYID="$KEYID" tools/mkrepo.sh dist

      - name: Verify signatures
        run: |
          gpg --verify dist/any/termuxvoid.db.sig dist/any/termuxvoid.db
          gpg --verify dist/any/sqlmap-*.pkg.tar.xz.sig dist/any/sqlmap-*.pkg.tar.xz
          test -s dist/termuxvoid.gpg.asc
          echo "packages: $(ls dist/any/*.pkg.tar.xz | wc -l)"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false
          user_name: Anon4You
          user_email: katilchora666@gmail.com
